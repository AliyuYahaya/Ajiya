# GoReleaser: https://goreleaser.com
#
# Try it without publishing:
#   goreleaser release --snapshot --clean
# which writes the archives to dist/.
#
# Release notes come from the Ajiya trailers, not from GoReleaser:
#   ajiya changelog <previous tag>..<tag> > notes.md
#   goreleaser release --clean --release-notes notes.md
# Nothing is published without the maintainer's go-ahead: releases are drafts.
version: 2

project_name: ajiya

builds:
  - id: ajiya
    main: ./cmd/ajiya
    binary: ajiya
    env:
      - CGO_ENABLED=0 # one static binary per platform
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/AliyuYahaya/Ajiya/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - id: ajiya
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# Sign and notarise the darwin binaries (cross-platform, runs on Linux; binaries
# only, no app bundle). Needs the `release` environment's secrets: MACOS_SIGN_P12
# (base64 .p12), MACOS_SIGN_PASSWORD, MACOS_NOTARY_KEY (base64 .p8),
# MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID. Without MACOS_SIGN_P12 the block
# is disabled, so `goreleaser release --snapshot` still builds unsigned.
# https://goreleaser.com/customization/notarize/
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [ajiya]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

changelog:
  disable: true # see the release notes above

release:
  draft: true

# Homebrew cask for the tap AliyuYahaya/homebrew-tap.
# skip_upload: true makes GoReleaser only WRITE the cask (dist/homebrew/Casks/
# ajiya.rb) and never push it. The gated tap job in the release workflow commits
# that file to the tap after the maintainer approves, and skips prerelease tags
# such as v1.0.0-rc.1 (what skip_upload: auto would do). The binaries are signed
# and notarised (notarize above), so the cask needs no quarantine hook.
homebrew_casks:
  - name: ajiya
    ids: [ajiya]
    binaries: [ajiya]
    homepage: https://github.com/AliyuYahaya/Ajiya
    license: MIT
    description: Keeps a project's phases and tickets as markdown in the repository, for coding agents and people
    repository:
      owner: AliyuYahaya
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: true
    caveats: |
      Register Ajiya with your coding agents: ajiya mcp install
      Set up a project: ajiya init
