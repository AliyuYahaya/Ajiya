# GoReleaser: https://goreleaser.com
#
# Try it without publishing:
#   goreleaser release --snapshot --clean
# which writes the archives to dist/.
#
# Release notes come from the Ajiya trailers, not from GoReleaser:
#   ajiya changelog <previous tag>..<tag> > notes.md
#   goreleaser release --clean --release-notes notes.md
# Nothing is published without the maintainer's go-ahead: releases are drafts.
version: 2

project_name: ajiya

builds:
  - id: ajiya
    main: ./cmd/ajiya
    binary: ajiya
    env:
      - CGO_ENABLED=0 # one static binary per platform
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/AliyuYahaya/Ajiya/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - id: ajiya
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true # see the release notes above

release:
  draft: true

# Homebrew cask for the tap. Not published: skip_upload stays true until the
# maintainer says to publish. The tap repository name is an assumption.
homebrew_casks:
  - name: ajiya
    ids: [ajiya]
    binaries: [ajiya]
    homepage: https://github.com/AliyuYahaya/Ajiya
    description: Keeps a project's phases and tickets as markdown in the repository, for coding agents and people
    repository:
      owner: AliyuYahaya
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: true
    hooks:
      post:
        # The binaries are not notarised, so macOS would block them on first
        # run; remove the quarantine attribute Homebrew's download sets.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ajiya"]
          end
    caveats: |
      Set up a project with: ajiya init
