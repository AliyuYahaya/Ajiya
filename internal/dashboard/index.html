<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajiya</title>
<!--
  Ajiya dashboard. Written into ajiya/index.html by 'ajiya build'; it reads
  ajiya/data.js (window.AJIYA, schema 1) from the same folder, so it works
  opened from disk and through 'ajiya serve'.

  No network requests: no web fonts, no CDNs, no analytics, no external URLs.
  One file, plain CSS and JS, no build step. Every text from data.js goes
  through esc() before it reaches innerHTML.
-->
<script>
  // Apply the saved theme before the page paints. Values: "light", "dark" or
  // nothing (follow the system).
  try { const t = localStorage.getItem('ajiya-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------------------------------------------------------------------------
   Theme. Every colour comes from these variables. Light is the default; dark
   applies when the system asks for it (unless the toggle chose light) or when
   the toggle chose dark. Keep the two dark blocks identical.
   ------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --c-blue: #2f5bd3; --c-blue-pale: #eaf0fc; --c-blue-line: #c3d2f5;
  --c-green: #1e9e6a; --c-green-pale: #e8f5ec;
  --c-red: #c62828; --c-red-pale: #fdecea;
  --c-amber: #f57f17; --c-amber-pale: #fff8e1; --c-amber-text: #b45d0e;
  --c-violet: #6b3fb8; --c-violet-pale: #f1ebfa;
  --c-text: #1a1a1a; --c-muted: #666666; --c-faint: #98a2ae;
  --c-page: #f5f7fa; --c-card: #ffffff; --c-line: #e6e9ee; --c-col: #eef1f5; --c-dash: #d6dbe2;
  --c-on-accent: #ffffff; --c-backdrop: rgba(26, 26, 26, .4); --c-shadow: rgba(0, 0, 0, .15);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --c-blue: #7c9dff; --c-blue-pale: #1d2847; --c-blue-line: #34477a;
    --c-green: #45c98f; --c-green-pale: #14301f;
    --c-red: #ff7b72; --c-red-pale: #3b1a1c;
    --c-amber: #f0a33c; --c-amber-pale: #3a2b12; --c-amber-text: #f5b95f;
    --c-violet: #b69cf0; --c-violet-pale: #2c2142;
    --c-text: #e6e8eb; --c-muted: #a3abb6; --c-faint: #6f7a87;
    --c-page: #0f1216; --c-card: #171b21; --c-line: #2a3039; --c-col: #13171c; --c-dash: #343b46;
    --c-on-accent: #0f1216; --c-backdrop: rgba(0, 0, 0, .6); --c-shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-blue: #7c9dff; --c-blue-pale: #1d2847; --c-blue-line: #34477a;
  --c-green: #45c98f; --c-green-pale: #14301f;
  --c-red: #ff7b72; --c-red-pale: #3b1a1c;
  --c-amber: #f0a33c; --c-amber-pale: #3a2b12; --c-amber-text: #f5b95f;
  --c-violet: #b69cf0; --c-violet-pale: #2c2142;
  --c-text: #e6e8eb; --c-muted: #a3abb6; --c-faint: #6f7a87;
  --c-page: #0f1216; --c-card: #171b21; --c-line: #2a3039; --c-col: #13171c; --c-dash: #343b46;
  --c-on-accent: #0f1216; --c-backdrop: rgba(0, 0, 0, .6); --c-shadow: rgba(0, 0, 0, .5);
}

/* Base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  --sidebar: 240px;
  background: var(--c-page); color: var(--c-text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--c-blue); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: sidebar and main column */
.shell { display: flex; height: 100vh; overflow: hidden; }
aside {
  width: var(--sidebar); flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--c-card); border-right: 1px solid var(--c-line); transition: width .15s;
}
.shell.collapsed aside { width: 68px; }
.side-top { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--c-line); }
.brand { font-size: 16px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shell.collapsed .side-top { justify-content: center; }
.shell.collapsed .side-top .brand, .shell.collapsed .hide-c { display: none !important; }
.icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: var(--c-faint); cursor: pointer; flex-shrink: 0; }
.icon-btn:hover { background: var(--c-page); color: var(--c-text); }
nav { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px;
  background: transparent; color: var(--c-muted); font-size: 14px; font-weight: 600; cursor: pointer; text-align: left;
}
.nav-item:hover { background: var(--c-page); color: var(--c-text); }
.nav-item[aria-current="true"] { background: var(--c-blue-pale); color: var(--c-blue); }
.nav-item .n { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c-faint); }
.nav-item .n.bad { color: var(--c-red); }
.nav-item[aria-current="true"] .n { color: var(--c-blue); }
.shell.collapsed .nav-item { justify-content: center; }
.nav-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); padding: 14px 12px 4px; }
.phase-link { display: flex; flex-direction: column; gap: 5px; padding: 8px 12px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.phase-link:hover { background: var(--c-page); }
.phase-link[aria-current="true"] { background: var(--c-blue-pale); }
.phase-link .t { font-size: 13px; font-weight: 600; color: var(--c-text); display: flex; gap: 8px; }
.phase-link .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phase-link .t span:last-child { margin-left: auto; color: var(--c-faint); font-weight: 500; font-size: 12px; white-space: nowrap; }
.side-foot { border-top: 1px solid var(--c-line); padding: 12px 16px; font-size: 12px; color: var(--c-muted); display: flex; align-items: center; gap: 8px; }
.side-foot b { color: var(--c-text); }
.side-foot .grow { flex: 1; min-width: 0; }
.shell.collapsed .side-foot { justify-content: center; padding: 12px 0; }

main { flex: 1; overflow-y: auto; min-width: 0; }
.main-inner { max-width: 1320px; margin: 0 auto; padding: 32px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; }
.page-head h1 { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.page-head p { margin: 0; color: var(--c-muted); font-size: 14px; }
.mobile-bar { display: none; }
.banner { background: var(--c-amber-pale); color: var(--c-amber-text); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; font-weight: 600; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
.filters input[type=search], .filters select, .select {
  font: inherit; font-size: 13px; background: var(--c-card); color: var(--c-text); border: 1px solid var(--c-line);
  border-radius: 8px; padding: 7px 10px; min-width: 0; max-width: 100%;
}
.filters input[type=search] { width: 260px; }
.filters input:focus, .filters select:focus, .select:focus { outline: 2px solid var(--c-blue-pale); border-color: var(--c-blue); }
.pill-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--c-line); background: var(--c-card); font-size: 13px; font-weight: 600; color: var(--c-muted); cursor: pointer; user-select: none; }
.pill-toggle[aria-pressed="true"] { background: var(--c-blue-pale); border-color: transparent; color: var(--c-blue); }
.link-btn { border: 0; background: transparent; color: var(--c-blue); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 6px; }

/* Cards, KPIs and bars */
.card-box { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi { padding: 20px; min-width: 0; }
button.kpi { text-align: left; cursor: pointer; width: 100%; }
button.kpi:hover { border-color: var(--c-blue); }
.kpi .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); }
.kpi .value { font-size: 28px; font-weight: 800; margin: 4px 0 10px; letter-spacing: -.02em; }
.kpi .value small { font-size: 14px; font-weight: 600; color: var(--c-faint); }
.kpi .sub { color: var(--c-muted); font-size: 12px; margin-top: 8px; }

.bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--c-line); gap: 1px; }
.bar span { display: block; height: 100%; }
.bar .d { background: var(--c-green); } .bar .p { background: var(--c-amber); } .bar .x { background: var(--c-faint); }

h2.section { font-size: 16px; font-weight: 800; margin: 28px 0 4px; display: flex; align-items: baseline; gap: 8px; }
h2.section:first-child { margin-top: 0; }
h2.section .count { color: var(--c-faint); font-weight: 600; font-size: 13px; }
.section-note { color: var(--c-muted); margin: 0 0 12px; font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
.card {
  background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; padding: 16px; cursor: pointer; color: var(--c-text);
  text-align: left; display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; transition: border-color .12s;
}
.card:hover, .card:focus-visible { border-color: var(--c-blue); outline: none; }
.card.ready { box-shadow: inset 3px 0 0 var(--c-blue); }
.card .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .rid { font-weight: 700; color: var(--c-text); }
.card .name { font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.card .meta { color: var(--c-muted); font-size: 12px; overflow-wrap: anywhere; }
.card .note { font-size: 12px; overflow-wrap: anywhere; }
.card .note.human { color: var(--c-violet); } .card .note.blocked { color: var(--c-red); }
.card .deps { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--c-muted); align-items: center; }
.card.compact { padding: 12px; gap: 6px; border-radius: 12px; }
.card.compact .name { font-size: 13px; }

/* Badges, chips and dots. State colours: done green, in progress amber,
   pending red, dropped grey. */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.badge.done { background: var(--c-green-pale); color: var(--c-green); }
.badge.in_progress { background: var(--c-amber-pale); color: var(--c-amber-text); }
.badge.pending { background: var(--c-red-pale); color: var(--c-red); }
.badge.dropped, .badge.plain { background: var(--c-page); color: var(--c-muted); }
.badge.ms { background: var(--c-blue-pale); color: var(--c-blue); }
.badge.ready { background: var(--c-blue); color: var(--c-on-accent); }
.badge.human, .badge.agent { background: var(--c-violet-pale); color: var(--c-violet); }
.badge.error { background: var(--c-red-pale); color: var(--c-red); }
.badge.warning { background: var(--c-amber-pale); color: var(--c-amber-text); }
.chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--c-page); color: var(--c-muted); cursor: pointer; border: 0; white-space: nowrap; }
.chip.ok { background: var(--c-green-pale); color: var(--c-green); }
.chip.wait { background: var(--c-red-pale); color: var(--c-red); }
.chip.unknown { cursor: default; text-decoration: line-through; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.done { background: var(--c-green); } .dot.in_progress { background: var(--c-amber); } .dot.pending { background: var(--c-red); }
.dot.dropped, .dot.none { background: var(--c-faint); } .dot.ready { background: var(--c-blue); } .dot.human { background: var(--c-violet); }

/* Board */
.board-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; color: var(--c-muted); font-size: 13px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--c-col); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 230px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 6px; }
.col-head h3 { margin: 0; font-size: 13px; font-weight: 800; }
.col-head .count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--c-muted); background: var(--c-card); border-radius: 99px; padding: 1px 8px; }
.col-sub { font-size: 12px; color: var(--c-muted); padding: 0 6px 4px; margin-top: -6px; }
.lane { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); padding: 6px 6px 0; }
.col-empty { font-size: 12px; color: var(--c-faint); text-align: center; padding: 16px 0; border: 1px dashed var(--c-dash); border-radius: 12px; }

/* Phases */
.phase { margin-bottom: 28px; }
.phase-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.phase-head h3 { margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phase-head .stats { color: var(--c-muted); font-size: 12px; display: flex; align-items: center; gap: 10px; }
.phase-head .bar { width: 160px; }
.phase-goal { color: var(--c-muted); font-size: 13px; margin: 4px 0 0; }

/* Milestones */
.ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
.ms-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ms-card .top { display: flex; align-items: center; gap: 8px; }
.ms-card .order { font-size: 11px; font-weight: 700; color: var(--c-faint); }
.ms-card .nm { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; }
.ms-card .pct { margin-left: auto; font-weight: 800; font-size: 20px; }
.ms-card .sub { color: var(--c-muted); font-size: 12px; overflow-wrap: anywhere; }

/* Tables and rows */
.table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--c-line); background: var(--c-card); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); border-bottom: 1px solid var(--c-line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--c-line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--c-page); }
td.note { color: var(--c-muted); font-size: 12.5px; max-width: 380px; overflow-wrap: anywhere; }
td .sub { color: var(--c-faint); font-size: 12px; }
.more { display: block; margin: 14px auto 0; background: var(--c-card); color: var(--c-text); border: 1px solid var(--c-line); border-radius: 8px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
.more:hover { border-color: var(--c-blue); color: var(--c-blue); }

.row { padding: 16px 20px; display: grid; grid-template-columns: minmax(170px, 1.2fr) 3fr auto; gap: 16px; align-items: center; }
.row + .row { border-top: 1px solid var(--c-line); }
.row .nums { color: var(--c-muted); font-size: 12px; white-space: nowrap; }
.row .src { color: var(--c-faint); font-size: 11.5px; }
.row.link { cursor: pointer; }
.row.link:hover { background: var(--c-page); }
.empty { color: var(--c-muted); padding: 32px; text-align: center; border: 1px dashed var(--c-line); border-radius: 16px; background: var(--c-page); }

/* Activity */
.day { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); margin: 20px 0 8px; }
.day:first-child { margin-top: 0; }
.commit { padding: 12px 16px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; }
.commit + .commit { border-top: 1px solid var(--c-line); }
.commit .h { color: var(--c-muted); padding-top: 2px; }
.commit .s { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.commit .m { grid-column: 2; color: var(--c-muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.commit .ch { grid-column: 2; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.commit .ch div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.commit.dim .s { color: var(--c-muted); font-weight: 500; }

/* Dependencies: HTML nodes over an SVG edge layer, laid out in columns by
   dependency depth. The canvas scrolls inside .g-wrap. */
.g-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; color: var(--c-muted); font-size: 13px; }
.g-tools .select { max-width: 260px; }
.g-tools .back { display: inline-flex; align-items: center; gap: 6px; }
.g-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 12px; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i.ln { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--c-dash); }
.g-legend i.ln.ok { border-color: var(--c-green); opacity: .6; }
.g-legend i.ln.ms { border-color: var(--c-blue); }
.g-wrap { overflow: auto; background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; max-height: calc(100vh - 230px); min-height: 360px; }
.g-canvas { position: relative; }
.g-canvas svg.edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.g-canvas path.e { fill: none; stroke: var(--c-dash); stroke-width: 1.6; marker-end: url(#g-arrow); }
.g-canvas path.e.ok { stroke: var(--c-green); stroke-opacity: .55; marker-end: url(#g-arrow-ok); }
.g-canvas path.e.ms { stroke: var(--c-blue); stroke-opacity: .8; marker-end: url(#g-arrow-hot); }
.g-canvas path.e.hot { stroke: var(--c-blue); stroke-opacity: 1; stroke-width: 2.4; marker-end: url(#g-arrow-hot); }
.g-canvas path.e.dim, .g-canvas text.dim { opacity: .1; }
.g-canvas text.cnt { font-size: 11px; font-weight: 700; fill: var(--c-muted); stroke: var(--c-card); stroke-width: 4px; paint-order: stroke; pointer-events: auto; cursor: default; }
.g-canvas text.cnt.hot { fill: var(--c-blue); }
.g-col { position: absolute; top: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c-faint); white-space: nowrap; }
.gnode {
  position: absolute; padding: 7px 10px 7px 14px; border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-card); color: var(--c-text);
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; overflow: hidden; transition: opacity .12s, border-color .12s;
}
.gnode::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c-faint); }
.gnode.done::before { background: var(--c-green); } .gnode.in_progress::before { background: var(--c-amber); } .gnode.pending::before { background: var(--c-red); }
.gnode.ready { border-color: var(--c-blue-line); box-shadow: 0 0 0 2px var(--c-blue-pale); }
.gnode:hover, .gnode:focus-visible, .gnode.hot { border-color: var(--c-blue); outline: none; }
.gnode .top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--c-muted); min-width: 0; white-space: nowrap; }
.gnode .top b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--c-text); }
.gnode .top .r { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.gnode .nm { font-size: 12.5px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gnode.phase .nm { font-size: 14px; font-weight: 800; }
/* Faded nodes stay opaque so links behind them do not show through. */
.gnode.ext { border-style: dashed; }
.gnode.ext > *, .gnode.ext::before { opacity: .55; }
.gnode.dim { border-color: var(--c-line); box-shadow: none; }
.gnode.dim > *, .gnode.dim::before { opacity: .18; }

/* Detail dialog */
dialog { border: 1px solid var(--c-line); border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--c-card); color: var(--c-text); }
dialog::backdrop { background: var(--c-backdrop); }
.dlg-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--c-line); position: sticky; top: 0; background: var(--c-card); z-index: 1; }
.dlg-head h3 { margin: 8px 40px 6px 0; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.dlg-head .close { position: absolute; right: 14px; top: 14px; }
.dlg-meta { color: var(--c-muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dlg-body { padding: 8px 24px 20px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 0 16px; }
.kv > div { padding: 9px 0; border-bottom: 1px solid var(--c-line); min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.kv .k { color: var(--c-faint); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding-top: 11px; }
.kv .v { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.kv .v.text { display: block; }

@media (max-width: 860px) {
  .shell { display: block; height: auto; overflow: visible; }
  aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px var(--c-shadow); width: 260px !important; }
  .shell.open aside { transform: none; }
  .shell.collapsed .hide-c { display: revert !important; }
  .shell.collapsed .side-top .brand { display: block !important; }
  .shell.collapsed .nav-item { justify-content: flex-start; }
  .collapse-btn { display: none !important; }
  .scrim { display: none; position: fixed; inset: 0; background: var(--c-backdrop); z-index: 15; }
  .shell.open .scrim { display: block; }
  main { overflow: visible; }
  .main-inner { padding: 0 16px 40px; }
  .mobile-bar { display: flex; align-items: center; gap: 10px; height: 56px; position: sticky; top: 0; background: var(--c-card); border-bottom: 1px solid var(--c-line); margin: 0 -16px 20px; padding: 0 16px; z-index: 10; }
  .filters input[type=search] { flex: 1 1 100%; width: 100%; }
  .filters select { flex: 1 1 40%; }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .kv { grid-template-columns: 1fr; }
  .kv .k { border-bottom: 0 !important; padding-bottom: 0; }
  td.note, th.note { display: none; }
  th, td { padding: 10px 12px; }
  .commit { grid-template-columns: 1fr; }
  .commit .m, .commit .ch { grid-column: 1; }
}
</style>
</head>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  /* -------------------------------------------------------------------------
     Helpers
     ----------------------------------------------------------------------- */
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Escaped text with `code` spans shown in mono.
  const md = s => esc(s).replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
  const icon = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  // Only web links become anchors; anything else (javascript: and the like) is shown as text.
  const isWeb = u => /^https?:\/\//i.test(String(u || ''));

  /* Theme toggle: works even without data. */
  const themeBtn = $('themeBtn');
  const isDark = () => document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const syncTheme = () => {
    const d = isDark();
    themeBtn.innerHTML = icon(d ? 'sun' : 'moon');
    themeBtn.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme');
    themeBtn.title = themeBtn.getAttribute('aria-label');
  };
  themeBtn.onclick = () => {
    const t = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    store.set('ajiya-theme', t);
    syncTheme();
  };
  syncTheme();

  /* Sidebar collapse and mobile menu. */
  const shell = $('shell');
  if (store.get('ajiya-collapsed') === '1') shell.classList.add('collapsed');
  const colBtn = $('collapseBtn');
  const syncCollapse = () => {
    const c = shell.classList.contains('collapsed');
    colBtn.innerHTML = icon(c ? 'right' : 'left');
    colBtn.setAttribute('aria-label', c ? 'Expand sidebar' : 'Collapse sidebar');
  };
  syncCollapse();
  colBtn.onclick = () => { shell.classList.toggle('collapsed'); store.set('ajiya-collapsed', shell.classList.contains('collapsed') ? '1' : '0'); syncCollapse(); };
  $('menuBtn').onclick = () => shell.classList.add('open');
  $('scrim').onclick = () => shell.classList.remove('open');

  /* -------------------------------------------------------------------------
     Data
     ----------------------------------------------------------------------- */
  const D = window.AJIYA;
  const view = $('view');
  if (!D || !Array.isArray(D.tickets)) {
    $('title').textContent = 'No data';
    view.innerHTML = '<div class="empty">data.js is missing or empty. Run <span class="mono">ajiya build</span> in the project folder, then reload this page.</div>';
    return;
  }
  if (D.schema !== 1) {
    $('banner').innerHTML = `<div class="banner">This page expects data schema 1 but data.js has schema ${esc(D.schema)}. Run <span class="mono">ajiya build</span> with the same ajiya version.</div>`;
  }
  const arr = v => Array.isArray(v) ? v : [];
  const milestones = arr(D.milestones), phases = arr(D.phases), apps = arr(D.apps);
  const tickets = D.tickets, checks = arr(D.checks), activity = arr(D.activity), nextIDs = arr(D.next);
  const project = D.project || {};
  const key = k => `ajiya:${project.prefix || project.name || ''}:${k}`; // localStorage key per project

  const byID = new Map(tickets.map(t => [t.id, t]));
  const phaseBySlug = new Map(phases.map(p => [p.slug, p]));
  const phaseIndex = new Map(phases.map((p, i) => [p.slug, i]));
  const msIndex = new Map(milestones.map((m, i) => [m.name, i]));
  const idIndex = new Map(tickets.map((t, i) => [t.id, i]));
  const nextIndex = new Map(nextIDs.map((id, i) => [id, i]));
  const phaseTitle = slug => (phaseBySlug.get(slug) || {}).title || slug;

  const state = t => t.status.state;
  const closed = t => state(t) === 'done' || state(t) === 'dropped';
  const human = t => !closed(t) && !!t.status.human;
  // Board column. A ticket that needs a human sits there whatever else holds;
  // in progress comes before "can start now" because started tickets are ready too.
  const column = t => closed(t) ? 'done' : human(t) ? 'human' : state(t) === 'in_progress' ? 'doing' : t.ready ? 'ready' : 'waiting';
  const stateLabel = { pending: 'Pending', in_progress: 'In progress', done: 'Done', dropped: 'Dropped' };
  // Phase display order, then ID: the order used everywhere except Next up.
  const byPlan = (a, b) => (phaseIndex.get(a.phase) ?? 1e9) - (phaseIndex.get(b.phase) ?? 1e9) || idIndex.get(a.id) - idIndex.get(b.id);
  const byNext = (a, b) => (nextIndex.get(a.id) ?? 1e9) - (nextIndex.get(b.id) ?? 1e9) || byPlan(a, b);

  const countsOf = list => {
    const c = { total: 0, done: 0, in_progress: 0, pending: 0, dropped: 0 };
    list.forEach(t => { c.total++; c[state(t)]++; });
    return c;
  };
  // Progress bar: green for closed (done and dropped), amber for in progress.
  const barHTML = c => {
    if (!c.total) return '<div class="bar"></div>';
    const w = n => (100 * (n || 0) / c.total).toFixed(2) + '%';
    return `<div class="bar" role="img" aria-label="${c.done + c.dropped} closed, ${c.in_progress} in progress of ${c.total}"><span class="d" style="width:${w(c.done)}"></span><span class="x" style="width:${w(c.dropped)}"></span><span class="p" style="width:${w(c.in_progress)}"></span></div>`;
  };
  const pct = c => c.total ? Math.floor(100 * (c.done + c.dropped) / c.total) : 100;
  const countText = c => `${c.done} done · ${c.in_progress} in progress · ${c.pending} pending${c.dropped ? ` · ${c.dropped} dropped` : ''}`;

  const stateBadge = t => `<span class="badge ${state(t)}">${stateLabel[state(t)] || esc(state(t))}</span>`;
  const msBadge = name => name ? `<span class="badge ms" title="Milestone">${esc(name)}</span>` : '';
  // A clickable ticket ID. ok: closed, wait: open. Unknown IDs are struck through.
  const chip = (id, colour) => {
    const t = byID.get(id);
    if (!t) return `<span class="chip unknown" title="Not in the plan">${esc(id)}</span>`;
    const cls = colour ? (closed(t) ? ' ok' : ' wait') : '';
    // A span, not a button: chips sit inside card buttons, and buttons cannot nest.
    return `<span class="chip${cls}" role="button" tabindex="0" data-open="${esc(id)}" title="${esc(t.title)}">${esc(id)}</span>`;
  };

  /* -------------------------------------------------------------------------
     Views. Keys match the nav buttons' data-tab.
     ----------------------------------------------------------------------- */
  const VIEWS = {
    overview: { label: 'Overview', sub: 'Progress per milestone, in order, and per phase.', filters: false },
    next: { label: 'Next up', sub: 'Tickets that can start now, in the order ajiya next gives: earliest milestone first, then what unblocks most.', filters: true },
    board: { label: 'Board', sub: 'Every ticket by where it stands.', filters: true },
    deps: { label: 'Dependencies', sub: 'What waits on what. An arrow points from a dependency to what needs it; columns go left to right by depth.', filters: false },
    phases: { label: 'Phases', sub: 'Tickets by phase, in display order.', filters: true },
    tickets: { label: 'Tickets', sub: 'Every ticket in the plan.', filters: true },
    apps: { label: 'Apps', sub: 'Tickets per app.', filters: false },
    checks: { label: 'Checks', sub: 'What ajiya check reports. Fix errors first.', filters: false },
    activity: { label: 'Activity', sub: 'Commits from the last 30 days, newest first, with the status changes they made.', filters: false },
  };
  const renderers = {
    overview: renderOverview, next: renderNext, board: renderBoard, deps: renderDeps, phases: renderPhases,
    tickets: renderTickets, apps: renderApps, checks: renderChecks, activity: renderActivity,
  };

  let tab = location.hash.slice(1) || store.get(key('tab'));
  if (!VIEWS[tab]) tab = 'overview';
  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (VIEWS[h] && h !== tab) go(h);
  });
  function go(t) {
    tab = t; store.set(key('tab'), t); ticketLimit = 150; activityLimit = 100;
    shell.classList.remove('open');
    render();
    document.querySelector('main').scrollTop = 0;
  }

  /* -------------------------------------------------------------------------
     Filters: text, app, phase, milestone and state. Kept in localStorage,
     except the search text.
     ----------------------------------------------------------------------- */
  const F = { q: '', app: store.get(key('app')) || '', phase: store.get(key('phase')) || '', ms: store.get(key('ms')) || '', state: store.get(key('state')) || '' };
  if (!apps.some(a => a.name === F.app)) F.app = '';
  if (!phaseBySlug.has(F.phase)) F.phase = '';
  if (F.ms !== '-' && !msIndex.has(F.ms)) F.ms = '';
  const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`;
  const appNames = [...new Set([...apps.map(a => a.name), ...tickets.map(t => t.app)])].filter(Boolean);
  $('appF').innerHTML = opt('', 'Any app', F.app) + appNames.map(a => opt(a, a, F.app)).join('');
  $('phaseF').innerHTML = opt('', 'Any phase', F.phase) + phases.map(p => opt(p.slug, p.title || p.slug, F.phase)).join('');
  $('msF').innerHTML = opt('', 'Any milestone', F.ms) + milestones.map(m => opt(m.name, m.name, F.ms)).join('') + opt('-', 'Not in a milestone', F.ms);
  $('msF').hidden = !milestones.length;
  $('appF').hidden = appNames.length < 2;
  $('stateF').value = F.state;
  if ($('stateF').value !== F.state) F.state = '';

  const textOf = t => [t.id, t.title, t.done_when, t.phase, phaseTitle(t.phase), t.app, t.milestone, t.status.text, ...(t.status.aliases || [])].join(' ').toLowerCase();
  const match = t => {
    if (F.app && t.app !== F.app) return false;
    if (F.phase && t.phase !== F.phase) return false;
    if (F.ms === '-' ? t.milestone : F.ms && t.milestone !== F.ms) return false;
    if (F.state) {
      if (F.state === 'ready') { if (!t.ready) return false; }
      else if (F.state === 'waiting') { if (column(t) !== 'waiting') return false; }
      else if (F.state === 'human') { if (!human(t)) return false; }
      else if (state(t) !== F.state) return false;
    }
    return !F.q || textOf(t).includes(F.q);
  };
  const setF = (k, v, stored) => { F[k] = v; if (stored) store.set(key(k), v); ticketLimit = 150; render(); };
  $('q').oninput = e => setF('q', e.target.value.trim().toLowerCase());
  $('appF').onchange = e => setF('app', e.target.value, true);
  $('phaseF').onchange = e => setF('phase', e.target.value, true);
  $('msF').onchange = e => setF('ms', e.target.value, true);
  $('stateF').onchange = e => setF('state', e.target.value, true);
  $('clearF').onclick = () => {
    ['app', 'phase', 'ms', 'state'].forEach(k => { F[k] = ''; store.set(key(k), ''); });
    F.q = ''; $('q').value = '';
    ['appF', 'phaseF', 'msF', 'stateF'].forEach(id => { $(id).value = ''; });
    render();
  };

  /* -------------------------------------------------------------------------
     Sidebar: counts on the nav and phase links in display order.
     ----------------------------------------------------------------------- */
  const project$ = project.name || 'Ajiya';
  $('brand').textContent = project$; $('mobileBrand').textContent = project$;
  const errors = checks.filter(c => c.level === 'error').length;
  function renderNav() {
    const n = {
      next: nextIDs.length, board: tickets.length, phases: phases.length, tickets: tickets.length,
      apps: apps.length, checks: checks.length, activity: activity.length,
    };
    document.querySelectorAll('#nav [data-tab]').forEach(b => {
      const k = b.dataset.tab;
      b.setAttribute('aria-current', String(k === tab));
      const s = b.querySelector('.n');
      if (s) { s.textContent = n[k] ? n[k] : ''; s.classList.toggle('bad', k === 'checks' && errors > 0); }
    });
    $('phaseNav').innerHTML = phases.length ? `<div class="nav-label hide-c">Phases</div>` + phases.map(p =>
      `<button class="phase-link hide-c" type="button" data-phase="${esc(p.slug)}" aria-current="${F.phase === p.slug}" title="${esc(p.goal)}">
        <span class="t"><span>${esc(p.title || p.slug)}</span><span>${p.counts.done + p.counts.dropped}/${p.counts.total}</span></span>${barHTML(p.counts)}</button>`).join('') : '';
    $('sideFoot').innerHTML = `Generated <b>${esc(D.generated)}</b><br>Refresh: <span class="mono">ajiya build</span>`;
  }
  $('nav').addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (t) return go(t.dataset.tab);
    const ph = e.target.closest('[data-phase]');
    if (ph) {
      F.phase = F.phase === ph.dataset.phase ? '' : ph.dataset.phase;
      store.set(key('phase'), F.phase);
      $('phaseF').value = F.phase;
      go(VIEWS[tab].filters ? tab : 'phases');
    }
  });

  /* -------------------------------------------------------------------------
     Ticket card, used by Next up, Board and Phases.
     ----------------------------------------------------------------------- */
  function card(t, compact) {
    const s = t.status;
    const waiting = !closed(t) && arr(t.waiting_on).length ? `<div class="deps">Waiting on ${t.waiting_on.map(id => chip(id, true)).join('')}</div>` : '';
    const notes = [];
    if (!closed(t) && s.human) notes.push(`<div class="note human">Needs a human: ${esc(s.human)}</div>`);
    if (!closed(t) && s.blocked) notes.push(`<div class="note blocked">Blocked: ${esc(s.blocked)}</div>`);
    if (state(t) === 'in_progress' && s.note) notes.push(`<div class="note">${esc(s.note)}</div>`);
    if (state(t) === 'dropped' && s.reason) notes.push(`<div class="note">${esc(s.reason)}</div>`);
    const meta = [phaseTitle(t.phase), t.app].filter(Boolean).map(esc).join(' · ') + (!closed(t) && t.unblocks ? ` · unblocks ${t.unblocks}` : '');
    return `<button class="card${compact ? ' compact' : ''}${t.ready && !compact ? ' ready' : ''}" type="button" data-open="${esc(t.id)}">
      <div class="head"><span class="rid mono">${esc(t.id)}</span>${msBadge(t.milestone)}
        ${compact && column(t) !== 'done' ? '' : `<span style="margin-left:auto">${stateBadge(t)}</span>`}</div>
      <div class="name">${md(t.title)}</div>
      <div class="meta">${meta}</div>
      ${notes.join('')}${waiting}
    </button>`;
  }
  const noMatch = '<div class="empty">Nothing matches the filters.</div>';

  /* -------------------------------------------------------------------------
     Overview: overall numbers, milestones in order, phases in display order.
     ----------------------------------------------------------------------- */
  function renderOverview() {
    const all = countsOf(tickets);
    const cols = { ready: 0, doing: 0, waiting: 0, human: 0 };
    tickets.forEach(t => { const c = column(t); if (c in cols) cols[c]++; });
    const warnings = checks.length - errors;
    let h = `<section class="kpis">
      <div class="card-box kpi"><div class="label">All tickets</div>
        <div class="value">${pct(all)}%<small> closed</small></div>${barHTML(all)}
        <div class="sub">${countText(all)} of ${all.total}</div></div>
      <button type="button" class="card-box kpi" data-go="next"><div class="label">Can start now</div>
        <div class="value">${nextIDs.length}<small> ${nextIDs.length === 1 ? 'ticket' : 'tickets'}</small></div>
        <div class="sub">${cols.doing} in progress · ${cols.waiting} waiting on others</div></button>
      <button type="button" class="card-box kpi" data-go="board"><div class="label">Needs a human</div>
        <div class="value">${cols.human}<small> open</small></div>
        <div class="sub">Tickets only a person can finish</div></button>
      <button type="button" class="card-box kpi" data-go="checks"><div class="label">Checks</div>
        <div class="value" style="color:${errors ? 'var(--c-red)' : checks.length ? 'var(--c-amber-text)' : 'var(--c-green)'}">${checks.length ? checks.length : 'OK'}${checks.length ? `<small> ${checks.length === 1 ? 'finding' : 'findings'}</small>` : ''}</div>
        <div class="sub">${plural(errors, 'error')} · ${plural(warnings, 'warning')}</div></button>
    </section>`;

    h += `<h2 class="section">Milestones <span class="count">${milestones.length}</span></h2>`;
    if (milestones.length) {
      h += `<p class="section-note">In order. Each counts the tickets it needs, including what they depend on; closed means done or dropped.</p><div class="ms-grid">` +
        milestones.map((m, i) => {
          const c = m.required;
          const closedN = c.done + c.dropped;
          const sub = c.total ? `${closedN}/${c.total} closed · ${c.in_progress} in progress · ${m.ready} can start now` : 'Needs no tickets';
          return `<div class="card-box ms-card">
            <div class="top"><span class="order">${i + 1}</span><span class="nm">${esc(m.name)}</span><span class="pct"${m.percent >= 100 ? ' style="color:var(--c-green)"' : ''}>${m.percent}%</span></div>
            ${barHTML(c)}<div class="sub">${sub}</div>
            ${arr(m.targets).length ? `<div class="sub">Targets: ${m.targets.map(esc).join(', ')}</div>` : ''}</div>`;
        }).join('') + '</div>';
    } else {
      h += `<p class="section-note">No milestones yet. Add one with <span class="mono">ajiya milestone add</span>.</p>`;
    }

    const top = nextIDs.map(id => byID.get(id)).filter(Boolean).slice(0, 6);
    if (top.length) {
      h += `<h2 class="section">Top of the queue</h2><p class="section-note">The first ${top.length} from Next up.</p><div class="grid">${top.map(t => card(t)).join('')}</div>`;
    }

    h += `<h2 class="section">Phases <span class="count">${phases.length}</span></h2><p class="section-note">In display order.</p>`;
    h += phases.length ? `<div class="card-box" style="margin-top:12px">${phases.map(p =>
      `<div class="row link" data-phase-go="${esc(p.slug)}">
        <div><div style="font-weight:700">${esc(p.title || p.slug)} ${msBadge(p.milestone)}</div><div class="src">${esc(p.goal)}</div></div>
        ${barHTML(p.counts)}
        <div class="nums">${p.percent}% · ${countText(p.counts)}</div></div>`).join('')}</div>` : '<div class="empty">No phases yet.</div>';
    view.innerHTML = h;
  }

  /* Next up: ready tickets in 'ajiya next' order, grouped by milestone. */
  function renderNext() {
    const list = nextIDs.map(id => byID.get(id)).filter(t => t && match(t));
    const groups = [];
    list.forEach(t => {
      const g = t.milestone || '';
      if (!groups.length || groups[groups.length - 1].ms !== g) groups.push({ ms: g, items: [] });
      groups[groups.length - 1].items.push(t);
    });
    view.innerHTML = groups.map(g =>
      `<h2 class="section">${g.ms ? `Milestone ${esc(g.ms)}` : milestones.length ? 'Not in a milestone' : 'Can start now'} <span class="count">${g.items.length}</span></h2>
       <div class="grid">${g.items.map(t => card(t)).join('')}</div>`).join('')
      || (nextIDs.length ? noMatch : '<div class="empty">Nothing can start now: every open ticket is waiting on another or blocked.</div>');
  }

  /* Board: five columns, optionally grouped by phase. */
  let lanes = store.get(key('lanes')) === '1';
  function renderBoard() {
    const cols = [
      ['ready', 'Can start now', 'Open, nothing in the way', 'ready'],
      ['doing', 'In progress', 'Started', 'in_progress'],
      ['waiting', 'Waiting', 'Open dependencies or blocked', 'pending'],
      ['human', 'Needs a human', 'Only a person can finish these', 'human'],
      ['done', 'Done', 'Done or dropped', 'done'],
    ];
    const list = tickets.filter(match);
    const colHTML = ([k, label, sub, dot]) => {
      const items = list.filter(t => column(t) === k).sort(k === 'ready' ? byNext : byPlan);
      let body;
      if (!items.length) body = '<div class="col-empty">None</div>';
      else if (lanes) body = phases.map(p => {
        const inPh = items.filter(t => t.phase === p.slug);
        return inPh.length ? `<div class="lane">${esc(p.title || p.slug)}</div>${inPh.map(t => card(t, true)).join('')}` : '';
      }).join('') + items.filter(t => !phaseBySlug.has(t.phase)).map(t => card(t, true)).join('');
      else body = items.map(t => card(t, true)).join('');
      return `<div class="col"><div class="col-head"><i class="dot ${dot}"></i><h3>${label}</h3><span class="count">${items.length}</span></div>
        <div class="col-sub">${sub}</div>${body}</div>`;
    };
    view.innerHTML = `<div class="board-tools">
        <button type="button" class="pill-toggle" id="laneBtn" aria-pressed="${lanes}">Group by phase</button>
        <span>${plural(list.length, 'ticket')}</span></div>
      <div class="board">${cols.map(colHTML).join('')}</div>`;
    $('laneBtn').onclick = () => { lanes = !lanes; store.set(key('lanes'), lanes ? '1' : '0'); renderBoard(); };
  }

  /* -------------------------------------------------------------------------
     Dependencies. Two graphs: the phases (the default, readable at any size)
     and the tickets of one phase with, faded, their direct dependencies and
     dependants in other phases. An arrow points from a dependency to what
     needs it.

     Layout: nodes that wait on each other (a cycle, found as a strongly
     connected component) share a column; every other node sits one column
     right of its deepest dependency, so arrows point right. Within a column:
     display order, then a few barycentre sweeps so arrows cross less. Nodes
     have a fixed size on a grid, so labels never overlap; long titles are cut
     and shown in full on hover. The canvas scrolls.
     ----------------------------------------------------------------------- */
  let depPhase = store.get(key('depphase')) || '';
  let depMs = store.get(key('depms')) || '';

  // Tickets a milestone needs: its targets' tickets (a phase's tickets, or
  // the ticket) and everything they depend on, directly or not.
  function requiredSet(name) {
    const m = milestones.find(x => x.name === name);
    if (!m) return null;
    const set = new Set(), stack = [];
    arr(m.targets).forEach(tg => {
      if (phaseBySlug.has(tg)) tickets.forEach(t => { if (t.phase === tg) stack.push(t.id); });
      else {
        const t = byID.get(tg) || tickets.find(x => arr(x.status.aliases).includes(tg));
        if (t) stack.push(t.id);
      }
    });
    while (stack.length) {
      const id = stack.pop();
      if (set.has(id)) continue;
      set.add(id);
      arr((byID.get(id) || {}).depends).forEach(d => { if (byID.has(d) && !set.has(d)) stack.push(d); });
    }
    return set;
  }

  // Everything reachable from id through next(id), not counting id.
  const reach = (id, next) => {
    const seen = new Set(), stack = [id];
    while (stack.length) next(stack.pop()).forEach(y => { if (y !== id && !seen.has(y)) { seen.add(y); stack.push(y); } });
    return seen;
  };

  // Columns for a graph. ids: node IDs in display order; ups: ID -> IDs it
  // depends on. Returns the columns (lists of IDs) and the IDs in a cycle.
  function layout(ids, ups) {
    const n = ids.length, ix = new Map(ids.map((id, i) => [id, i]));
    const adj = ids.map(id => [...new Set(ups.get(id) || [])].map(d => ix.get(d)).filter(j => j !== undefined));
    // Tarjan's strongly connected components, without recursion. Components
    // come out dependencies first.
    const num = new Array(n).fill(-1), low = new Array(n), on = new Array(n).fill(false), comp = new Array(n);
    const stack = [];
    let counter = 0, nc = 0;
    for (let s0 = 0; s0 < n; s0++) {
      if (num[s0] >= 0) continue;
      num[s0] = low[s0] = counter++; stack.push(s0); on[s0] = true;
      const work = [[s0, 0]];
      while (work.length) {
        const top = work[work.length - 1], v = top[0];
        if (top[1] < adj[v].length) {
          const w = adj[v][top[1]++];
          if (num[w] < 0) { num[w] = low[w] = counter++; stack.push(w); on[w] = true; work.push([w, 0]); }
          else if (on[w]) low[v] = Math.min(low[v], num[w]);
        } else {
          work.pop();
          if (work.length) { const u = work[work.length - 1][0]; low[u] = Math.min(low[u], low[v]); }
          if (low[v] === num[v]) { let w; do { w = stack.pop(); on[w] = false; comp[w] = nc; } while (w !== v); nc++; }
        }
      }
    }
    const members = Array.from({ length: nc }, () => []);
    comp.forEach((c, i) => members[c].push(i));
    const lvl = new Array(nc).fill(0);
    for (let c = 0; c < nc; c++) members[c].forEach(v => adj[v].forEach(w => { if (comp[w] !== c) lvl[c] = Math.max(lvl[c], lvl[comp[w]] + 1); }));
    const depth = ids.map((_, i) => lvl[comp[i]]);
    const cyclic = new Set();
    members.forEach(m => { if (m.length > 1) m.forEach(v => cyclic.add(ids[v])); });

    const cols = [];
    ids.forEach((_, i) => (cols[depth[i]] = cols[depth[i]] || []).push(i));
    const downs = ids.map(() => []);
    adj.forEach((ds, i) => ds.forEach(j => downs[j].push(i)));
    const pos = new Array(n);
    cols.forEach(c => c.forEach((v, r) => { pos[v] = r; }));
    const sweep = (c, nb) => {
      const k = new Map(c.map(v => {
        const o = nb[v].filter(j => depth[j] !== depth[v]);
        return [v, o.length ? o.reduce((a, j) => a + pos[j], 0) / o.length : pos[v]];
      }));
      c.sort((a, b) => k.get(a) - k.get(b) || a - b);
      c.forEach((v, r) => { pos[v] = r; });
    };
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 1; i < cols.length; i++) sweep(cols[i], adj);
      for (let i = cols.length - 2; i >= 0; i--) sweep(cols[i], downs);
    }
    return { cols: cols.map(c => c.map(i => ids[i])), cyclic };
  }

  // Draws a graph. nodes: [{ id, cls, title, html, attr }] in display order;
  // edges: [{ from, to, cls, ms, label, title }] where to depends on from.
  function graphHTML(nodes, edges, size) {
    const ups = new Map();
    edges.forEach(e => { if (!ups.has(e.to)) ups.set(e.to, []); ups.get(e.to).push(e.from); });
    const { cols, cyclic } = layout(nodes.map(n => n.id), ups);
    const { W, H } = size, GX = 90, GY = 12, PAD = 20, TOP = 40, LOOP = 70;
    const xy = new Map();
    let rows = 0;
    cols.forEach((c, i) => { rows = Math.max(rows, c.length); c.forEach((id, r) => xy.set(id, { x: PAD + i * (W + GX), y: TOP + r * (H + GY), d: i })); });
    const width = PAD * 2 + cols.length * W + Math.max(0, cols.length - 1) * GX + (cyclic.size ? LOOP : 0);
    const height = TOP + rows * (H + GY) + PAD;
    const paths = [], labels = [];
    edges.forEach(e => {
      const a = xy.get(e.from), b = xy.get(e.to);
      if (!a || !b) return;
      let d, lx;
      const y1 = a.y + H / 2, y2 = b.y + H / 2;
      if (a.d < b.d) {
        const x1 = a.x + W, x2 = b.x - 4, mx = (x1 + x2) / 2;
        d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; lx = mx;
      } else {
        // Same column: the two wait on each other. Loop out to the right,
        // downward links wider than upward ones so a pair does not overlap.
        const x1 = a.x + W, x2 = b.x + W + 4, bx = x1 + (y2 > y1 ? 56 : 28) + Math.min(14, Math.abs(y2 - y1) / 20);
        d = `M${x1},${y1} C${bx},${y1} ${bx},${y2} ${x2},${y2}`; lx = x1 + (bx - x1) * .75;
      }
      const at = `data-from="${esc(e.from)}" data-to="${esc(e.to)}"${e.ms ? ' data-ms="1"' : ''}`;
      paths.push(`<path class="e${e.cls ? ' ' + e.cls : ''}" ${at} d="${d}"/>`);
      if (e.label) labels.push(`<text class="cnt" ${at} x="${lx}" y="${(y1 + y2) / 2 + 4}" text-anchor="middle"><title>${esc(e.title || '')}</title>${esc(e.label)}</text>`);
    });
    const colTitle = i => i === 0 ? 'Nothing before' : `${i} step${i > 1 ? 's' : ''} in`;
    const heads = cols.map((c, i) => `<div class="g-col" style="left:${PAD + i * (W + GX)}px">${colTitle(i)}</div>`).join('');
    const body = nodes.map(nd => {
      const p = xy.get(nd.id);
      return `<button type="button" class="gnode ${nd.cls}" data-node="${esc(nd.id)}" ${nd.attr || ''} style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px"
        title="${esc(nd.title)}${cyclic.has(nd.id) ? '\n(in a cycle: these wait on each other)' : ''}">${nd.html}</button>`;
    }).join('');
    const marker = (id, v) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(${v});stroke:none"/></marker>`;
    return {
      cyclic,
      html: `<div class="g-wrap" id="gWrap"><div class="g-canvas" id="gCanvas" style="width:${width}px;height:${height}px">
        <svg class="edges" width="${width}" height="${height}" aria-hidden="true"><defs>${marker('g-arrow', '--c-dash')}${marker('g-arrow-ok', '--c-green')}${marker('g-arrow-hot', '--c-blue')}</defs>
        ${paths.join('')}${labels.join('')}</svg>${heads}${body}</div></div>`,
    };
  }

  // Hover and focus trace a node's chain; the milestone path is the resting state.
  function wireGraph(up, down, msSet) {
    const canvas = $('gCanvas');
    if (!canvas) return;
    const nodeEls = [...canvas.querySelectorAll('.gnode')];
    const edgeEls = [...canvas.querySelectorAll('[data-from]')];
    const memo = new Map();
    const chainOf = id => {
      if (!memo.has(id)) memo.set(id, new Set([id, ...reach(id, up), ...reach(id, down)]));
      return memo.get(id);
    };
    const paint = chain => {
      nodeEls.forEach(el => {
        const on = chain ? chain.has(el.dataset.node) : !msSet || msSet.has(el.dataset.node);
        el.classList.toggle('dim', !on); el.classList.toggle('hot', !!chain && on);
      });
      edgeEls.forEach(el => {
        const on = chain ? chain.has(el.dataset.from) && chain.has(el.dataset.to) : !msSet || el.dataset.ms === '1';
        el.classList.toggle('dim', !on); el.classList.toggle('hot', !!chain && on); el.classList.toggle('ms', !chain && !!msSet && on);
      });
    };
    let cur = null;
    const enter = e => { const n = e.target.closest('.gnode'); if (n && n.dataset.node !== cur) { cur = n.dataset.node; paint(chainOf(cur)); } };
    const leave = () => { if (cur !== null) { cur = null; paint(null); } };
    canvas.addEventListener('mouseover', enter);
    canvas.addEventListener('focusin', enter);
    canvas.addEventListener('mouseleave', leave);
    canvas.addEventListener('focusout', e => { if (!canvas.contains(e.relatedTarget)) leave(); });
    paint(null);
  }

  const plainTitle = s => String(s ?? '').replace(/`/g, '');
  function renderDeps() {
    if (depPhase && !phaseBySlug.has(depPhase)) depPhase = '';
    if (depMs && !msIndex.has(depMs)) depMs = '';
    const req = depMs ? requiredSet(depMs) : null;
    const msSel = milestones.length ? `<select class="select" id="gMs" aria-label="Path to a milestone">${opt('', 'Path to a milestone: none', depMs)}${
      milestones.map(m => opt(m.name, `Path to ${m.name}`, depMs)).join('')}</select>` : '';
    const legend = `<div class="g-legend"><span><i class="ln ok"></i>Dependency closed</span><span><i class="ln"></i>Still open</span>${
      req ? '<span><i class="ln ms"></i>Milestone path</span>' : ''}<span><i class="dot done"></i>Done</span><span><i class="dot in_progress"></i>In progress</span><span><i class="dot pending"></i>Pending</span></div>`;
    const tUp = id => arr((byID.get(id) || {}).depends).filter(d => byID.has(d));
    const tDown = id => arr((byID.get(id) || {}).dependants).filter(d => byID.has(d));
    let tools, g, up, down, msNodes = null;

    if (!depPhase) {
      // Phase graph: an arrow from A to B when a ticket in B depends on one in A.
      const ph = new Map(phases.map(p => [p.slug, { inside: 0, reqN: 0, ups: new Set(), downs: new Set() }]));
      const links = new Map();
      tickets.forEach(t => {
        const b = ph.get(t.phase);
        if (!b) return;
        if (req && req.has(t.id)) b.reqN++;
        arr(t.depends).forEach(d => {
          const u = byID.get(d);
          if (!u || !ph.has(u.phase)) return;
          if (u.phase === t.phase) { b.inside++; return; }
          const k = u.phase + '\n' + t.phase;
          if (!links.has(k)) links.set(k, { from: u.phase, to: t.phase, n: 0, open: 0, ms: 0 });
          const l = links.get(k);
          l.n++;
          if (!closed(u)) l.open++;
          if (req && req.has(t.id) && req.has(u.id)) l.ms++;
          b.ups.add(u.phase); ph.get(u.phase).downs.add(t.phase);
        });
      });
      const edges = [...links.values()].map(l => ({
        from: l.from, to: l.to, cls: l.open ? '' : 'ok', ms: l.ms > 0, label: String(l.n),
        title: `${plural(l.n, 'link')}: tickets in ${phaseTitle(l.to)} depend on tickets in ${phaseTitle(l.from)}${l.open ? ` (${l.open} still open)` : ' (all closed)'}${req ? ` · ${l.ms} on the path to ${depMs}` : ''}`,
      }));
      const nodes = phases.map(p => {
        const c = p.counts, b = ph.get(p.slug);
        const st = c.total && c.done + c.dropped === c.total ? 'done' : c.in_progress || c.done ? 'in_progress' : 'pending';
        const meta = req ? `${b.reqN} of ${c.total} needed for ${depMs}` : `${plural(c.total, 'ticket')} · ${plural(b.inside, 'link')} inside`;
        return {
          id: p.slug, cls: 'phase ' + st, attr: `data-dep-phase="${esc(p.slug)}"`,
          title: `${p.title || p.slug}${p.goal ? '\n' + p.goal : ''}\n${countText(c)}\nDepends on ${plural(b.ups.size, 'phase')}, needed by ${b.downs.size}. Click to see its tickets.`,
          html: `<span class="top"><b>${esc(p.slug)}</b><span class="r">${c.done + c.dropped}/${c.total}</span></span>
            <span class="nm">${esc(p.title || p.slug)}</span>${barHTML(c)}<span class="top">${esc(meta)}</span>`,
        };
      });
      if (req) msNodes = new Set(phases.filter(p => ph.get(p.slug).reqN).map(p => p.slug));
      g = graphHTML(nodes, edges, { W: 240, H: 88 });
      up = id => [...(ph.get(id) || { ups: [] }).ups];
      down = id => [...(ph.get(id) || { downs: [] }).downs];
      tools = `${msSel}<span>${plural(phases.length, 'phase')} · ${plural(edges.length, 'link')} between phases${g.cyclic.size ? ` · ${g.cyclic.size} phases wait on each other` : ''} · click a phase to see its tickets</span>`;
      if (!phases.length) g.html = '<div class="empty">No phases yet. Add one with <span class="mono">ajiya phase add</span>.</div>';
    } else {
      // One phase's tickets, with their direct dependencies and dependants in
      // other phases, faded. Links between two outside tickets are left out.
      const p = phaseBySlug.get(depPhase);
      const inside = tickets.filter(t => t.phase === depPhase);
      const inSet = new Set(inside.map(t => t.id));
      const ext = new Set();
      inside.forEach(t => [...tUp(t.id), ...tDown(t.id)].forEach(d => { if (!inSet.has(d)) ext.add(d); }));
      const shown = [...inside, ...[...ext].map(id => byID.get(id))].sort(byPlan);
      const edges = [];
      shown.forEach(t => tUp(t.id).forEach(d => {
        if (!(inSet.has(d) || ext.has(d)) || !(inSet.has(t.id) || inSet.has(d))) return;
        edges.push({ from: d, to: t.id, cls: closed(byID.get(d)) ? 'ok' : '', ms: !!req && req.has(d) && req.has(t.id) });
      }));
      const nodes = shown.map(t => {
        const out = !inSet.has(t.id);
        return {
          id: t.id, cls: `${state(t)}${t.ready ? ' ready' : ''}${out ? ' ext' : ''}`, attr: `data-open="${esc(t.id)}"`,
          title: `${t.id} ${plainTitle(t.title)}\n${stateLabel[state(t)] || state(t)}${t.ready ? ', can start now' : ''}${out ? `\nIn phase ${phaseTitle(t.phase)}` : ''}${t.milestone ? `\nMilestone ${t.milestone}` : ''}`,
          html: `<span class="top"><b>${esc(t.id)}</b>${t.milestone ? `<span>${esc(t.milestone)}</span>` : ''}<span class="r">${out ? esc(phaseTitle(t.phase)) : t.ready ? 'can start now' : esc(stateLabel[state(t)] || state(t))}</span></span>
            <span class="nm">${esc(plainTitle(t.title))}</span>`,
        };
      });
      if (req) msNodes = req;
      g = graphHTML(nodes, edges, { W: 230, H: 54 });
      up = tUp; down = tDown;
      tools = `<button type="button" class="pill-toggle back" id="gBack">${icon('left')}All phases</button>
        <select class="select" id="gPhase" aria-label="Phase">${phases.map(x => opt(x.slug, x.title || x.slug, depPhase)).join('')}</select>${msSel}
        <span>${plural(inside.length, 'ticket')}${ext.size ? ` · ${ext.size} in other phases (dashed)` : ''}${g.cyclic.size ? ` · ${g.cyclic.size} wait on each other` : ''}</span>`;
      if (!inside.length) g.html = `<div class="empty">${esc(p.title || p.slug)} has no tickets yet.</div>`;
    }

    view.innerHTML = `<div class="g-tools">${tools}${legend}</div>${g.html}`;
    wireGraph(up, down, msNodes);
    const setPhase = v => { depPhase = v; store.set(key('depphase'), v); renderDeps(); };
    const canvas = $('gCanvas');
    if (canvas) canvas.addEventListener('click', e => { const n = e.target.closest('[data-dep-phase]'); if (n) setPhase(n.dataset.depPhase); });
    if ($('gBack')) $('gBack').onclick = () => setPhase('');
    if ($('gPhase')) $('gPhase').onchange = e => setPhase(e.target.value);
    if ($('gMs')) $('gMs').onchange = e => { depMs = e.target.value; store.set(key('depms'), depMs); renderDeps(); };
  }

  /* Phases: each phase in display order with its tickets. */
  function renderPhases() {
    const h = phases.map(p => {
      const list = tickets.filter(t => t.phase === p.slug && match(t)).sort(byPlan);
      if (!list.length && (F.q || F.app || F.ms || F.state || (F.phase && F.phase !== p.slug))) return '';
      return `<section class="phase"><div class="phase-head"><h3>${esc(p.title || p.slug)} <span class="mono" style="color:var(--c-faint);font-weight:500">${esc(p.slug)}</span> ${msBadge(p.milestone)}</h3>
        <div class="stats"><span>${p.percent}% · ${countText(p.counts)}</span>${barHTML(p.counts)}</div></div>
        ${p.goal ? `<p class="phase-goal">${md(p.goal)}</p>` : ''}
        ${list.length ? `<div class="grid">${list.map(t => card(t)).join('')}</div>` : '<div class="empty" style="margin-top:12px">No tickets yet.</div>'}</section>`;
    }).join('');
    view.innerHTML = h || (phases.length ? noMatch : '<div class="empty">No phases yet. Add one with <span class="mono">ajiya phase add</span>.</div>');
  }

  /* Tickets: a table, 150 rows at a time. */
  let ticketLimit = 150;
  function renderTickets() {
    const list = tickets.filter(match).sort(byPlan);
    const rows = list.slice(0, ticketLimit).map(t => {
      const s = t.status;
      const note = closed(t) ? '' : [s.human && `Needs a human: ${s.human}`, s.blocked && `Blocked: ${s.blocked}`, s.note].filter(Boolean).map(esc).join(' · ');
      return `<tr class="click" data-open="${esc(t.id)}">
        <td class="mono" style="white-space:nowrap;font-weight:700">${esc(t.id)}</td>
        <td>${md(t.title)}<div class="sub">${esc(phaseTitle(t.phase))} · ${esc(t.app)}</div></td>
        <td>${stateBadge(t)}${t.ready ? ' <span class="badge ready">Ready</span>' : ''}</td>
        <td>${msBadge(t.milestone)}</td>
        <td>${arr(t.depends).map(id => chip(id, true)).join(' ')}</td>
        <td class="note">${note}</td></tr>`;
    }).join('');
    view.innerHTML = `<div class="board-tools"><span>${plural(list.length, 'ticket')}</span></div>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Ticket</th><th>State</th><th>Milestone</th><th>Depends on</th><th class="note">Note</th></tr></thead><tbody>${rows}</tbody></table></div>` : noMatch}
      ${list.length > ticketLimit ? `<button class="more" id="more" type="button">Show ${Math.min(150, list.length - ticketLimit)} more</button>` : ''}`;
    const more = $('more');
    if (more) more.onclick = () => { ticketLimit += 150; renderTickets(); };
  }

  /* Apps: progress per app. Click to see its tickets. */
  function renderApps() {
    view.innerHTML = apps.length ? `<div class="card-box">${apps.map(a => `<div class="row link" data-app-go="${esc(a.name)}">
      <div><div style="font-weight:700">${esc(a.name)} ${a.kind ? `<span class="badge plain">${esc(a.kind)}</span>` : ''}</div><div class="src mono">${esc(a.path || '')}</div></div>
      ${barHTML(a.counts)}
      <div class="nums">${countText(a.counts)} · <b style="color:var(--c-text)">${a.counts.total}</b></div>
    </div>`).join('')}</div>` : '<div class="empty">No apps yet. Add one with <span class="mono">ajiya app add</span>.</div>';
  }

  /* Checks: findings as ajiya check prints them, errors first. */
  function renderChecks() {
    if (!checks.length) {
      view.innerHTML = '<div class="empty">All checks pass.</div>';
      return;
    }
    view.innerHTML = `<div class="board-tools"><span>${plural(errors, 'error')} · ${plural(checks.length - errors, 'warning')} · run <span class="mono">ajiya check</span> for the live list</span></div>
      <div class="table-wrap"><table><thead><tr><th>Level</th><th>Code</th><th>Where</th><th>Problem</th><th class="note">Fix</th></tr></thead><tbody>
      ${checks.map(c => `<tr>
        <td><span class="badge ${c.level === 'error' ? 'error' : 'warning'}">${esc(c.level)}</span></td>
        <td class="mono" style="white-space:nowrap">${esc(c.code)}</td>
        <td class="mono" style="white-space:nowrap">${esc(c.location)}</td>
        <td>${linkIDs(c.message)}</td>
        <td class="note">${linkIDs(c.fix)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  // Escaped text with known ticket IDs turned into chips.
  function linkIDs(s) {
    return esc(s).replace(/\b[A-Z][A-Z0-9]*-\d+\b/g, id => byID.has(id) ? chip(id) : id);
  }

  /* Activity: commits newest first, grouped by day. */
  let activityLimit = 100;
  const change = c => `<div><i class="dot ${esc(c.to)}"></i>${chip(c.id)}<span>${c.from ? `${esc(stateLabel[c.from] || c.from)} → ` : 'New · '}${esc(stateLabel[c.to] || c.to)}</span>${
    c.text && c.to !== 'pending' ? `<span style="color:var(--c-muted)">${esc(c.text)}</span>` : ''}</div>`;
  function commitHTML(e) {
    const badges = [e.merge && '<span class="badge plain">merge</span>', e.revert && '<span class="badge plain">revert</span>',
      e.chore && '<span class="badge plain">chore</span>', e.agent && `<span class="badge agent" title="Co-authored by an agent">${esc(e.agent)}</span>`].filter(Boolean).join('');
    return `<div class="commit${e.chore || e.merge ? ' dim' : ''}">
      <span class="mono h" title="${esc(e.hash)}">${esc(e.short)}</span>
      <div class="s"><span>${esc(e.subject)}</span>${badges}</div>
      <div class="m"><span>${esc(e.author)}</span>${arr(e.refs).length ? `<span>·</span>${e.refs.map(id => chip(id)).join('')}` : ''}</div>
      ${arr(e.changes).length ? `<div class="ch">${e.changes.map(change).join('')}</div>` : ''}</div>`;
  }
  function renderActivity() {
    if (!activity.length) {
      view.innerHTML = '<div class="empty">No commits in the last 30 days, or this is not a git repository.</div>';
      return;
    }
    const list = activity.slice(0, activityLimit);
    let h = '', day = null;
    list.forEach(e => {
      if (e.date !== day) { h += (day === null ? '' : '</div>') + `<div class="day">${esc(e.date)}</div><div class="card-box">`; day = e.date; }
      h += commitHTML(e);
    });
    h += '</div>';
    if (activity.length > activityLimit) h += `<button class="more" id="more" type="button">Show ${Math.min(100, activity.length - activityLimit)} more</button>`;
    view.innerHTML = h;
    const more = $('more');
    if (more) more.onclick = () => { activityLimit += 100; renderActivity(); };
  }

  /* -------------------------------------------------------------------------
     Render the current view.
     ----------------------------------------------------------------------- */
  function render() {
    renderNav();
    const v = VIEWS[tab];
    $('title').textContent = v.label;
    $('subtitle').textContent = v.sub;
    document.title = `${v.label} · ${project$}`;
    if (location.hash.slice(1) !== tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }
    $('filters').style.display = v.filters ? '' : 'none';
    $('clearF').hidden = !(F.q || F.app || F.phase || F.ms || F.state);
    renderers[tab]();
  }

  /* -------------------------------------------------------------------------
     Ticket detail dialog.
     ----------------------------------------------------------------------- */
  const dlg = $('dlg');
  function openTicket(id) {
    const t = byID.get(id);
    if (!t) return;
    const s = t.status;
    const colName = { ready: 'Can start now', doing: '', waiting: 'Waiting', human: 'Needs a human', done: '' }[column(t)];
    $('dlgBadges').innerHTML = `<span class="mono" style="font-weight:700">${esc(t.id)}</span>${stateBadge(t)}${msBadge(t.milestone)}${
      colName ? `<span class="badge ${column(t) === 'ready' ? 'ready' : column(t) === 'human' ? 'human' : 'plain'}">${colName}</span>` : ''}`;
    $('dlgTitle').innerHTML = md(t.title);
    $('dlgMeta').innerHTML = `<span>${esc(phaseTitle(t.phase))} <span class="mono">(${esc(t.phase)})</span> · ${esc(t.app)}</span>`;

    const rows = [];
    const add = (k, v, text) => { if (v) rows.push(`<div class="k">${k}</div><div class="v${text ? ' text' : ''}">${v}</div>`); };
    add('Done when', md(t.done_when), true);
    add('Status', esc(s.text), true);
    if (s.note) add('Note', esc(s.note), true);
    if (s.human) add('Needs a human', esc(s.human), true);
    if (s.blocked) add('Blocked', esc(s.blocked), true);
    if (s.reason) add('Dropped because', esc(s.reason), true);
    // Evidence for done tickets.
    const ev = [];
    if (s.commit) ev.push(`<span class="mono">${esc(s.commit)}</span>`);
    if (s.issue) ev.push(isWeb(s.link) ? `<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">issue #${esc(s.issue)}</a>` : `issue #${esc(s.issue)}`);
    if (s.by) ev.push(`by ${esc(s.by)}`);
    if (s.done_before_ajiya) ev.push('done before Ajiya');
    if (s.date) ev.push(esc(s.date));
    if (s.tests_passed) ev.push('<span class="badge done">tests passed</span>');
    add('Evidence', ev.join(' <span style="color:var(--c-faint)">·</span> '));
    if (s.link) add('Link', isWeb(s.link) ? `<a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">${esc(s.link)}</a>` : esc(s.link), true);
    if (arr(s.aliases).length) add('Was', s.aliases.map(a => `<span class="mono">${esc(a)}</span>`).join(', '));
    add('Depends on', arr(t.depends).map(d => chip(d, true)).join(''));
    if (!closed(t) && arr(t.waiting_on).length) add('Waiting on', t.waiting_on.map(d => chip(d, true)).join(''));
    add('Needed by', arr(t.dependants).map(d => chip(d, true)).join(''));
    if (!closed(t) && t.unblocks) add('Unblocks', `${plural(t.unblocks, 'open ticket')}, directly or not`);
    const commits = activity.filter(e => arr(e.refs).includes(t.id) || arr(e.changes).some(c => c.id === t.id));
    if (commits.length) add('Commits', commits.map(e => `<span class="mono" title="${esc(e.date)}">${esc(e.short)}</span> ${esc(e.subject)}`).join('<br>'), true);
    $('dlgBody').innerHTML = `<div class="kv">${rows.join('')}</div>`;
    if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
    dlg.scrollTop = 0;
  }
  const closeDlg = () => { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };
  $('dlgClose').onclick = closeDlg;
  dlg.addEventListener('click', e => {
    if (e.target === dlg) return closeDlg();
    const c = e.target.closest('[data-open]');
    if (c) openTicket(c.dataset.open);
  });

  /* Clicks in the main view: ticket chips and cards, KPI shortcuts, phase and app rows. */
  view.addEventListener('click', e => {
    const op = e.target.closest('[data-open]');
    if (op) { e.stopPropagation(); return openTicket(op.dataset.open); }
    const g = e.target.closest('[data-go]');
    if (g) return go(g.dataset.go);
    const ph = e.target.closest('[data-phase-go]');
    if (ph) { F.phase = ph.dataset.phaseGo; store.set(key('phase'), F.phase); $('phaseF').value = F.phase; return go('phases'); }
    const ap = e.target.closest('[data-app-go]');
    if (ap) { F.app = ap.dataset.appGo; store.set(key('app'), F.app); $('appF').value = F.app; return go('tickets'); }
  });

  // Keyboard: Enter or Space on a chip opens its ticket, like a button.
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('span[data-open]')) { e.preventDefault(); e.target.click(); }
  });

  render();
})();
</script>
</body>
</html>
